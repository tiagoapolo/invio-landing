        <h1>Emita NFS-e para clientes no exterior sem depender do portal da prefeitura</h1>
        <p>Cadastre seu CNPJ e o certificado A1 uma vez. Depois, emita suas notas, acompanhe o status ou a rejeição e baixe o XML no painel.</p>
        <h2>Como emitir nota fiscal para cliente do exterior</h2>
        <p>Cadastre o CNPJ emitente e o perfil do serviço, associe um certificado A1 válido e crie a NFS-e para o cliente estrangeiro. A configuração fiscal e o tratamento tributário devem seguir a orientação do seu contador.</p>
        <h2>O que é o certificado digital A1</h2>
        <p>É um arquivo .pfx associado ao emitente e usado para assinar a NFS-e antes do envio.</p>
        <p>O plano grátis inclui até 2 NFS-e por mês e 1 emitente. É necessário possuir um certificado digital A1 válido. A Invio não recebe pagamentos, não realiza câmbio e não substitui a contabilidade.</p>
