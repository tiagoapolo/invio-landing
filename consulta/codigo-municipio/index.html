      <main>
        <h1>Código IBGE de município para a NFS-e Nacional</h1>
        <p>O leiaute da NFS-e Nacional não aceita o nome da cidade: os campos de localidade recebem o código IBGE de 7 dígitos.</p>
        <p>A tabela completa dos 5.571 municípios, com busca por nome, UF e código, precisa de JavaScript habilitado. Os dados vêm da <a href="https://servicodados.ibge.gov.br/api/docs/localidades">API pública de localidades do IBGE</a>.</p>
        <p>Consulte também a <a href="/consulta/lc116">tabela LC 116/2003</a>, a <a href="/consulta/nbs">tabela NBS</a> ou a <a href="/llms-full.txt">referência completa do produto</a>.</p>
