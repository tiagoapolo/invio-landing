        <h1>Tabela LC 116/2003 e os códigos de tributação nacional</h1>
        <p>A lista de serviços da Lei Complementar 116/2003 define o item de ISS de cada atividade. Na NFS-e Nacional o item vira um código de 6 dígitos — item, subitem e desdobro — enviado no campo cTribNac.</p>
        <p>A tabela completa, com busca por item e por descrição, precisa de JavaScript habilitado. O texto oficial da norma está disponível em <a href="https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp116.htm">planalto.gov.br</a>.</p>
        <p>Consulte também a <a href="/consulta/nbs">tabela NBS</a>, o <a href="/consulta/codigo-municipio">código IBGE de município</a> ou a <a href="/llms-full.txt">referência completa do produto</a>.</p>
      </main>
