        <h1>Tabela NBS 2.0 — Nomenclatura Brasileira de Serviços</h1>
        <p>A NBS classifica serviços, intangíveis e demais operações que produzam variações no patrimônio. Na NFS-e Nacional ela aparece no campo cNBS, que aceita apenas os códigos de nível-folha, com 9 dígitos.</p>
        <p>A tabela completa, com busca por código e por descrição, precisa de JavaScript habilitado. A tabela oficial está disponível no <a href="https://www.gov.br/mdic/pt-br/assuntos/sdic/comercio-e-servicos/nbs-nomenclatura-brasileira-de-servicos">portal do MDIC</a>.</p>
        <p>Consulte também a <a href="/consulta/lc116">tabela LC 116/2003</a>, o <a href="/consulta/codigo-municipio">código IBGE de município</a> ou a <a href="/llms-full.txt">referência completa do produto</a>.</p>
